[package]
name = "viewer-kindle"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[features]
desktop-preview = []

[[bin]]
name = "viewer-kindle"
path = "src/main.rs"

[[bin]]
name = "viewer-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop-preview"]

[dependencies]
primitive-app.workspace = true
primitive-ui.workspace = true
hayro = "=0.9.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
