name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    permissions:
      contents: write
    uses: PrimitiveOS/kindle-primitive-build/.github/workflows/package.yml@6235c4d7327fbcfce74fc68ec06ae3c4f9c4665d
    with:
      id: primitive-viewer
      dir: viewer
      binary-crate: viewer-kindle
      arches: armhf
      firmware-min: "5.16.3"
      docs-licence-file: LICENSE-DOCS
      sibling-tools-ref: 107fc3edb511ff86abfaf37bf8958c2a087b334b
